name: simsplit
description: "Ứng dụng ghi chú và chia chi tiêu nhóm, hoạt động offline."
publish_to: "none"

version: 1.0.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.2

  # Local database
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # Code generation / immutable models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Online backend: Firebase Auth + Firestore (R-3, used by lib/data only)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Functional programming (Either, Option)
  fpdart: ^1.1.0

  # Unique ID generation
  uuid: ^4.6.0

  # UI extras
  flutter_slidable: ^4.0.3
  intl: ^0.20.2
  shared_preferences: ^2.5.6

  # Icons & splash screen (dev tools, kept here for generator commands)
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.8
  google_sign_in: ^7.2.0
  share_plus: ^13.3.1
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.13.2

  # Linting
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    # Bundled (not fetched at runtime) so the app stays fully offline.
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700

  generate: true # enables flutter gen-l10n for .arb files

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # Masters are in design/icon/; export with the uiux-designer skill.
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#0A0A0A"

flutter_native_splash:
  # Colours match AppTheme surfaces.
  color: "#FFFFFF"
  color_dark: "#0B0B0B"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo_dark.png
  android_12:
    image: assets/images/splash_logo.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/splash_logo_dark.png
    color_dark: "#0B0B0B"
    icon_background_color_dark: "#0B0B0B"
  ios: true
  fullscreen: false
