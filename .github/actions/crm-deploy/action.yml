name: Deploy the crm image
description: >-
  Pushes the image built by crm_deploy.yml's build job to one environment's
  registry and deploys it to the Cloud Run service `crm` (R-9).
inputs:
  expected-project:
    description: The GCP project the environment must point at
    required: true
  image-repository:
    description: vars.CRM_IMAGE_REPOSITORY of the environment
    required: true
  deployer:
    description: vars.GCP_CRM_DEPLOYER of the environment
    required: true
  workload-identity-provider:
    description: vars.GCP_WORKLOAD_IDENTITY_PROVIDER of the environment
    required: true
  traits-table:
    description: >-
      The warehouse traits table to check crm/traits.yaml against before
      deploying (dev only); empty skips the check
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The registry and deployer come from environment variables, so both must
    # belong to the environment's project.
    - name: Check environment
      shell: bash
      env:
        EXPECTED: ${{ inputs.expected-project }}
        REPOSITORY: ${{ inputs.image-repository }}
        DEPLOYER: ${{ inputs.deployer }}
      run: |
        if [[ "$REPOSITORY" != */"$EXPECTED"/* ]] || [[ "$DEPLOYER" != *"@$EXPECTED.iam.gserviceaccount.com" ]]; then
          echo "::error::This environment must point at $EXPECTED (CRM_IMAGE_REPOSITORY='$REPOSITORY', GCP_CRM_DEPLOYER='$DEPLOYER')"
          exit 1
        fi
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: crm-image
        path: ${{ runner.temp }}
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.deployer }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - if: inputs.traits-table != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26"
        cache: npm
        cache-dependency-path: services/crm/package-lock.json
    # A trait catalog that no longer matches the dbt model would break audiences.
    - name: Check the trait catalog
      if: inputs.traits-table != ''
      shell: bash
      env:
        TRAITS_TABLE: ${{ inputs.traits-table }}
      run: |
        npm ci --prefix services/crm --no-audit --no-fund
        npm --prefix services/crm run -s crm -- check-traits --table "$TRAITS_TABLE"
    - name: Push the image
      shell: bash
      env:
        IMAGE: ${{ inputs.image-repository }}/crm
        REGION: asia-southeast1
      run: |
        gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
        docker load < "$RUNNER_TEMP/crm.tar.gz"
        docker tag "crm:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"
        docker push "$IMAGE:$GITHUB_SHA"
        digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
        echo "DIGEST=$digest" >> "$GITHUB_ENV"
        echo "Image: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
    # Only the image changes; scaling, limits and env stay as Terraform set them.
    - name: Deploy
      shell: bash
      env:
        REGION: asia-southeast1
      run: gcloud run deploy crm --image "$DIGEST" --region "$REGION" --quiet
