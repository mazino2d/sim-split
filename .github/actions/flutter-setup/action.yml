name: Flutter setup
description: >
  Pins this repo's Flutter SDK for the shared flutter-setup action
  (mazino2d/github-workflows): install Flutter (cached), resolve packages and,
  optionally, produce the gitignored generated sources (build_runner + gen-l10n).

inputs:
  codegen:
    description: Run build_runner and gen-l10n (needed by analyze and tests).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: mazino2d/github-workflows/actions/flutter-setup@v1
      with:
        # Keep in step with FLUTTER_VERSION in .devcontainer/Dockerfile.
        flutter-version: "3.47.x"
        codegen: ${{ inputs.codegen }}
