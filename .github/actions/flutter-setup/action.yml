name: Flutter setup
description: >
  Install Flutter (cached), resolve packages and, optionally, produce the
  gitignored generated sources (build_runner + gen-l10n).

inputs:
  codegen:
    description: Run build_runner and gen-l10n (needed by analyze and tests).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.41.x"
        channel: stable
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get

    # build_runner output depends only on the sources it reads and the locked
    # package versions, so an exact key hit lets us skip it entirely.
    - name: Restore generated sources
      if: inputs.codegen == 'true'
      id: codegen-cache
      uses: actions/cache@v6
      with:
        path: |
          lib/**/*.g.dart
          lib/**/*.freezed.dart
        key: codegen-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'build.yaml', 'lib/**/*.dart') }}

    - name: Run code generation
      if: inputs.codegen == 'true' && steps.codegen-cache.outputs.cache-hit != 'true'
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Generate localizations
      if: inputs.codegen == 'true'
      shell: bash
      run: flutter gen-l10n
