# Version updates. Security updates for vulnerable dependencies are enabled in
# the repo settings (managed in mazino2d/everything-as-code) and use this file
# for grouping.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  # Third-party actions are pinned to a commit SHA with a "# vX.Y.Z" comment;
  # Dependabot bumps the SHA and the comment together.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # R-4 telemetry endpoint (Cloud Run) and its base image.
  - package-ecosystem: npm
    directory: /services/telemetry
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      telemetry-npm-minor-patch:
        update-types: [minor, patch]
    # Keep @types/node on the runtime's major: odd Node majors never become
    # LTS, so skip their types.
    ignore:
      - dependency-name: "@types/node"
        versions: ["25.x", "27.x", "29.x"]

  - package-ecosystem: docker
    directory: /services/telemetry
    schedule:
      interval: weekly
    # Odd Node majors never become LTS; stay on even (LTS) majors.
    ignore:
      - dependency-name: node
        versions: ["~> 25.0", "~> 27.0", "~> 29.0"]

  # Firestore rules tests (firebase/test).
  - package-ecosystem: npm
    directory: /firebase/test
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rules-test-npm-minor-patch:
        update-types: [minor, patch]

  # Features in .devcontainer/devcontainer.json (the Flutter version in its
  # Dockerfile is bumped by hand together with flutter-setup).
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
