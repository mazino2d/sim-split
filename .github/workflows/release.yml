name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # e.g. v1.0.0

# Least privilege by default; jobs that need more declare their own block.
permissions:
  contents: read

jobs:
  validate-version:
    name: Validate tag matches pubspec version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only pubspec.yaml is needed to compare versions.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false
      - name: Check version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"          # strip 'v' prefix
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "Tag version: $TAG_VERSION"
          echo "pubspec version: $PUBSPEC_VERSION"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "❌ Version mismatch: tag=$TAG_VERSION pubspec=$PUBSPEC_VERSION"
            exit 1
          fi

  build-android:
    name: Android Production Build
    needs: validate-version
    # A called workflow can only use permissions its caller grants.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build_android.yml
    with:
      track: production
      status: draft  # TODO: change to 'completed' after app passes first Play Store review
    secrets: inherit

  # build-ios:                         # disabled — Apple Developer account not yet active
  #   name: iOS App Store Build
  #   needs: validate-version
  #   uses: ./.github/workflows/build_ios.yml
  #   with:
  #     destination: appstore
  #   secrets: inherit

  create-github-release:
    name: Create GitHub Release
    needs: [build-android]            # removed build-ios until Apple account is ready
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # No checkout: the release is created from the pushed tag via the API.
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: simsplit-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: app-release.aab
          generate_release_notes: true
          name: 'SimSplit ${{ github.ref_name }}'
