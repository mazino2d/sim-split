name: Release

# Every job that deploys runs in the prd GitHub Environment (set in the
# called workflows), so each one waits for the maintainer's approval.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # CalVer, e.g. v2026.10.22

# Least privilege by default; jobs that need more declare their own block.
permissions:
  contents: read

jobs:
  validate-version:
    name: Validate tag matches pubspec version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only pubspec.yaml is needed to compare versions.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false
      - name: Check version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"          # strip 'v' prefix
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "Tag version: $TAG_VERSION"
          echo "pubspec version: $PUBSPEC_VERSION"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "❌ Version mismatch: tag=$TAG_VERSION pubspec=$PUBSPEC_VERSION"
            exit 1
          fi

  build-android:
    name: Android Production Build
    needs: validate-version
    # A called workflow can only use permissions its caller grants.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build_android.yml
    with:
      track: production
      # Committing a completed release sends it for review (managed publishing
      # is off), and once approved it reaches every user. Full rollout while
      # the user base is small; for a staged rollout again, set status
      # inProgress with user_fraction "0.2" and widen with play_rollout.yml.
      status: completed
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  # The web app, Firestore rules and indexes go to simsplit-as-se1-prd only
  # with a production tag; main deploys them to dev. They wait for the
  # Android upload, so a failed or rejected build ships nothing to prd.
  deploy-firebase:
    name: Firebase Production Deploy
    needs: [build-android]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/firebase_deploy.yml
    with:
      environment: prd

  # The R-4 telemetry endpoint ships with the release too. It doesn't wait
  # for the Android upload: the endpoint must accept what the new build sends
  # and stays compatible with the builds already out.
  deploy-telemetry:
    name: Telemetry Deploy
    needs: validate-version
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/telemetry_deploy.yml

  # build-ios:                         # disabled — Apple Developer account not yet active
  #   name: iOS App Store Build
  #   needs: validate-version
  #   uses: ./.github/workflows/build_ios.yml
  #   with:
  #     destination: appstore
  #   secrets: inherit

  create-github-release:
    name: Create GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # No checkout: the release is created from the pushed tag via the API.
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: simsplit-prd-release.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: app-prd-release.aab
          generate_release_notes: true
          name: 'SimSplit ${{ github.ref_name }}'
