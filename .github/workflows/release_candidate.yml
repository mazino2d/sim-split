name: Release Candidate

# A vYYYY.M.D-rc.N tag ships main's build to the Play closed testing track
# (alpha) as YYYY.M.D-rc.N, with the release notes in android/fastlane/whatsnew/.
# YYYY.M.D is the day the candidate is cut; N counts candidates that day.
# release.yml ignores these tags: its filter matches the whole tag name.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

# Least privilege by default; jobs that need more declare their own block.
permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate tag format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check CalVer without zero padding
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v20[0-9]{2}\.(1[0-2]|[1-9])\.(3[01]|[12][0-9]|[1-9])-rc\.[1-9][0-9]*$ ]]; then
            echo "❌ $GITHUB_REF_NAME is not vYYYY.M.D-rc.N (no zero padding, N from 1)"
            exit 1
          fi

  build-android:
    name: Android Closed Test Build
    needs: validate-tag
    # A called workflow can only use permissions its caller grants.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build_android.yml
    with:
      track: alpha
      # Closed testers get it as soon as Play approves it.
      status: completed
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  create-github-release:
    name: Create GitHub pre-release
    needs: [build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # No checkout: the release is created from the pushed tag via the API.
    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: simsplit-prd-release.aab

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          files: app-prd-release.aab
          generate_release_notes: true
          prerelease: true
          name: 'SimSplit ${{ github.ref_name }}'
