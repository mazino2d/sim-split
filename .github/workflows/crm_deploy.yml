name: CRM Deploy

# Ships the R-9 notifications service (services/crm) with the config in crm/
# baked into the image, built once per commit; the same digest runs on dev and
# then prd.
#   - push to main: dev only.
#   - crm_apply.yml (a maintainer comments "crm apply" on the PR) calls this
#     with the merged commit and prd: true, so the same run goes on to prd.
#   - manual run: dev, or dev then prd.
# The service, its triggers and the deployers are managed in
# mazino2d/everything-as-code (terraform/gcp/simsplit-as-se1-<env>/crm.tf).
# PRs validate and plan the config in pr_validate.yml.
on:
  push:
    branches: [main]
    paths:
      - crm/**
      - services/crm/**
      - .github/workflows/crm_deploy.yml
  workflow_dispatch:
    inputs:
      prd:
        description: "Also deploy to prd after dev"
        type: boolean
        default: false
  workflow_call:
    inputs:
      sha:
        description: "The commit on main to deploy"
        type: string
        required: true
      prd:
        description: "Also deploy to prd after dev"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      # Every path deploys a commit that is on main.
      - name: Check ref
        id: ref
        env:
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::crm deploys only from main, not $GITHUB_REF"
            exit 1
          fi
          echo "sha=${SHA_INPUT:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      # Checked through the API before anything is checked out.
      - name: Check the commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)
          case "$status" in
            identical | ahead) ;;
            *) echo "::error::$SHA is not on main ($status)"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.sha }}
      # No dependency cache: this job builds the production image, so nothing
      # restored from a cache other runs can write may reach it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: npm ci --prefix services/crm
      - run: npm --prefix services/crm test
      - name: Compile crm/ into the image
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: npm --prefix services/crm run -s crm -- compile --out config.json --version "$SHA"
      - name: Build the image
        env:
          SHA: ${{ steps.ref.outputs.sha }}
        run: |
          docker build -t "crm:$SHA" services/crm
          docker save "crm:$SHA" | gzip > "$RUNNER_TEMP/crm.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-image
          path: ${{ runner.temp }}/crm.tar.gz
          retention-days: 3

  dev:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    concurrency:
      group: crm-deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: ./.github/actions/crm-deploy
        with:
          sha: ${{ needs.build.outputs.sha }}
          expected-project: simsplit-as-se1-dev
          image-repository: ${{ vars.CRM_IMAGE_REPOSITORY }}
          deployer: ${{ vars.GCP_CRM_DEPLOYER }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          traits-table: dataplatform-as-se1-dev.simsplit_crm.user_traits

  # Only when asked ("crm apply", or a manual run with prd), and only once dev
  # runs the same image.
  prd:
    needs: [build, dev]
    if: inputs.prd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prd
    concurrency:
      group: crm-deploy-prd
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: ./.github/actions/crm-deploy
        with:
          sha: ${{ needs.build.outputs.sha }}
          expected-project: simsplit-as-se1-prd
          image-repository: ${{ vars.CRM_IMAGE_REPOSITORY }}
          deployer: ${{ vars.GCP_CRM_DEPLOYER }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
