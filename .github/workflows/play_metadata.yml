name: Play Store Metadata

# Syncs the store listing (text, icon, feature graphic, screenshots, contact
# details) and, when data_safety.csv changes, the Data safety form from
# android/fastlane/metadata/android to Google Play, for both apps: prd
# (com.mazino2d.simsplit) and dev (SimSplit Dev, com.mazino2d.simsplit.dev,
# same listing under its own title). Plan/apply style:
#   - pull request → dry run against Play, result posted as a PR comment
#   - push to main  → real sync
#   - manual run    → from main only; dry run by default, real sync when
#                     dry_run is unticked
# Both jobs run in the `store` GitHub Environment (managed in
# mazino2d/everything-as-code), which admits main only (pull_request_target
# runs on main too), so a manual run from any other branch is rejected
# before it starts; there is no branch preview.
on:
  # pull_request_target runs with the base ref (main), which is what the
  # Workload Identity provider accepts. The plan job therefore must never run
  # code from the PR: it checks out main and copies in only the PR's metadata
  # files as data.
  pull_request_target:
    branches: [main]
    paths:
      - "android/fastlane/metadata/android/**"
  push:
    branches: [main]
    paths:
      - "android/fastlane/metadata/android/**"
      - "scripts/play_metadata.py"
      - ".github/workflows/play_metadata.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would change (run from main)"
        type: boolean
        default: true
      data_safety:
        description: "Also upload data_safety.csv"
        type: boolean
        default: false

env:
  METADATA: android/fastlane/metadata/android

jobs:
  plan:
    name: Plan store listing
    # Same-repo PRs only: fork PRs must not get a token for the Play account.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Not in the play-<package> groups: a dry run never commits its edit (it
    # deletes it), so it can't clobber another workflow's edit, and PR plans
    # shouldn't wait for uploads. A commit elsewhere at the same moment can
    # fail the plan; re-run it.
    concurrency:
      group: play-metadata-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
      pull-requests: write # sticky plan comment
    steps:
      # Trusted code: the base branch, not the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Use the PR's metadata files (data only)
        id: metadata
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          if git diff --quiet HEAD "$HEAD_SHA" -- "$METADATA/data_safety.csv"; then
            echo "data_safety=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_safety=true" >> "$GITHUB_OUTPUT"
          fi
          rm -rf "$METADATA"
          git checkout "$HEAD_SHA" -- "$METADATA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet google-api-python-client google-auth

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/113980760756/locations/global/workloadIdentityPools/github/providers/sim-split
          service_account: gha-play-publisher@simsplit-as-se1-prd.iam.gserviceaccount.com

      - name: Dry run
        id: plan
        env:
          DATA_SAFETY: ${{ steps.metadata.outputs.data_safety }}
        run: |
          args=(--dry-run)
          [ "$DATA_SAFETY" = "true" ] && args+=(--data-safety)
          status=0
          for env in prd dev; do
            echo "== $env" >> plan.txt
            python scripts/play_metadata.py sync "${args[@]}" --env "$env" >> plan.txt 2>&1 || status=$?
          done
          cat plan.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Comment the plan on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STATUS: ${{ steps.plan.outputs.status }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- play-metadata-plan -->'
          {
            echo "$marker"
            if [ "$STATUS" = "0" ]; then
              echo "### Google Play listing — dry run"
              echo "Merging this PR will apply the changes below to Google Play."
            else
              echo "### Google Play listing — dry run failed"
            fi
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo "<sub>Metadata at ${HEAD_SHA:0:7}; sync script from \`main\`.</sub>"
          } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
          exit "$STATUS"

  apply:
    name: Sync store listing (${{ matrix.env }})
    if: github.event_name != 'pull_request_target'
    # One job per app, so each can join that app's Play edit group.
    strategy:
      # A dev failure never holds back the production listing, or vice versa.
      fail-fast: false
      matrix:
        include:
          - env: prd
            package: com.mazino2d.simsplit
          - env: dev
            package: com.mazino2d.simsplit.dev
    # Play rejects concurrent edits on one app: the same group as uploads
    # (build_android.yml) and rollouts (play_rollout.yml) of that package.
    # Never cancelled half-way.
    concurrency:
      group: play-${{ matrix.package }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: store
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet google-api-python-client google-auth

      # Same keyless identity as build_android.yml; it also needs "Manage store
      # presence" on both apps in Play Console → Users and permissions.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/113980760756/locations/global/workloadIdentityPools/github/providers/sim-split
          service_account: gha-play-publisher@simsplit-as-se1-prd.iam.gserviceaccount.com

      # On push, re-upload the Data safety form only when its CSV changed
      # anywhere in the push (github.event.before..HEAD), not just in the last
      # commit. The shallow checkout has HEAD only, so fetch `before` too (one
      # commit is enough to diff two trees). No usable `before` (a new branch
      # pushes all zeros, or a force push dropped it) → upload to be safe.
      - name: Detect Data safety change
        id: data-safety
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
            echo "No usable base commit ('$BEFORE'); uploading Data safety"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- "$METADATA/data_safety.csv"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync
        env:
          # The `store` environment admits main only, so this job never runs
          # elsewhere; the ref check is a second guard that keeps any other
          # ref from changing Play.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || github.ref != 'refs/heads/main' }}
          DATA_SAFETY: ${{ inputs.data_safety || steps.data-safety.outputs.changed == 'true' }}
          APP_ENV: ${{ matrix.env }}
        run: |
          set -o pipefail
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$DATA_SAFETY" = "true" ] && args+=(--data-safety)
          echo "### $APP_ENV" | tee -a "$GITHUB_STEP_SUMMARY"
          python scripts/play_metadata.py sync "${args[@]}" --env "$APP_ENV" | tee -a "$GITHUB_STEP_SUMMARY"
