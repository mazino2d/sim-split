name: Firebase Deploy

# Deploys Firestore rules, indexes and Hosting (firebase.json) for one
# environment. Hosting serves the web app, where invite links open (R-3 P6),
# so app changes redeploy it too.
#   - dev: push to main touching the files below, or a manual run from main
#     → simsplit-as-se1-dev, web app at simsplit-as-se1-dev.web.app, then a
#     smoke test of the live site.
#   - prd: only when release.yml calls it for a vYYYY.M.D tag, after checking
#     the tag against pubspec.yaml and uploading the Android build
#     → simsplit-as-se1-prd, web app at simsplit.web.app.
# Each job runs in the GitHub Environment of the same name (managed in
# mazino2d/everything-as-code): dev admits main only; prd admits v* tags and
# waits for the maintainer's approval. Both hold the same variable names.
on:
  push:
    branches: [main]
    paths:
      - firebase.json
      - .firebaserc
      - firebase/**
      - "!firebase/test/**"
      - lib/**
      - web/**
      - assets/**
      - l10n.yaml
      - pubspec.yaml
      - pubspec.lock
      - .github/actions/flutter-setup/**
      - .github/workflows/firebase_deploy.yml
  # Manual runs deploy dev; prd needs release.yml's checks.
  workflow_dispatch:
  workflow_call:
    inputs:
      environment:
        description: "dev or prd"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

# One deploy per environment at a time, so a release never waits for a dev
# deploy.
concurrency:
  group: firebase-deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # inputs.environment is only set under workflow_call; push and manual runs
    # are always dev, whatever ref they run on.
    environment: ${{ inputs.environment || 'dev' }}
    env:
      APP_ENV: ${{ inputs.environment || 'dev' }}
    steps:
      # The prd environment admits every v* tag, release candidates too, so
      # the exact production tag is checked here as well.
      # The project and deployer come from environment variables. An unset
      # FIREBASE_PROJECT would make firebase-tools fall back to the
      # .firebaserc default (prd), so both must be set and match the
      # environment before anything is built.
      - name: Check environment
        env:
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT }}
          GCP_FIREBASE_DEPLOYER: ${{ vars.GCP_FIREBASE_DEPLOYER }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          case "$APP_ENV" in
            dev) expected=simsplit-as-se1-dev ;;
            prd)
              expected=simsplit-as-se1-prd
              if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::prd deploys only from a vYYYY.M.D tag, not '$GITHUB_REF_NAME'"
                exit 1
              fi
              ;;
            *) echo "::error::Unknown environment '$APP_ENV'"; exit 1 ;;
          esac
          : "${FIREBASE_PROJECT:?vars.FIREBASE_PROJECT is not set in the $APP_ENV environment}"
          : "${GCP_FIREBASE_DEPLOYER:?vars.GCP_FIREBASE_DEPLOYER is not set in the $APP_ENV environment}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?vars.GCP_WORKLOAD_IDENTITY_PROVIDER is not set in the $APP_ENV environment}"
          if [ "$FIREBASE_PROJECT" != "$expected" ]; then
            echo "::error::$APP_ENV must deploy to $expected, but FIREBASE_PROJECT is '$FIREBASE_PROJECT'"
            exit 1
          fi
          if [[ "$GCP_FIREBASE_DEPLOYER" != *"@$expected.iam.gserviceaccount.com" ]]; then
            echo "::error::GCP_FIREBASE_DEPLOYER '$GCP_FIREBASE_DEPLOYER' is not an account of $expected"
            exit 1
          fi
          echo "Deploying $APP_ENV from $GITHUB_REF_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/flutter-setup

      # App Check on web (R-3 P9). The reCAPTCHA Enterprise site key is public
      # and comes from the environment; while it is unset, App Check stays off
      # on web. TELEMETRY_URL is the environment's own endpoint (each accepts
      # App Check tokens from its own project only).
      - name: Build web
        env:
          RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
          TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
        run: |
          flutter build web --release \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=RECAPTCHA_ENTERPRISE_SITE_KEY="$RECAPTCHA_ENTERPRISE_SITE_KEY" \
            --dart-define=TELEMETRY_URL="$TELEMETRY_URL"

      # web/ holds the prd files; firebase/hosting/dev/ overrides some of them
      # on the dev site (assetlinks.json for com.mazino2d.simsplit.dev).
      - name: Apply dev Hosting overrides
        if: env.APP_ENV == 'dev'
        run: cp -R firebase/hosting/dev/. build/web/

      # Keyless auth via Workload Identity Federation, managed in
      # mazino2d/everything-as-code (terraform/gcp/simsplit-as-se1-<env>/github_actions.tf).
      # Only main and v* tags (vYYYY.M.D, vYYYY.M.D-rc.N) of this repo can impersonate the accounts.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FIREBASE_DEPLOYER }}

      # .firebaserc maps the hosting target "app" to each project's site.
      - name: Deploy Firestore and Hosting
        env:
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT }}
        # Checked above; repeated so this step can never deploy to the
        # .firebaserc default.
        run: |
          : "${FIREBASE_PROJECT:?}"
          npx --yes firebase-tools@14.27.0 deploy --only firestore,hosting \
            --project "$FIREBASE_PROJECT" --non-interactive

      # dev only: prd changes ship with the release, which the maintainer
      # checks by hand. The dev site is the project's default Hosting site.
      - name: Check the live site
        if: env.APP_ENV == 'dev'
        env:
          SITE: https://${{ vars.FIREBASE_PROJECT }}.web.app
          PACKAGE_NAME: com.mazino2d.simsplit.dev
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE/")
          [ "$code" = 200 ] || { echo "::error::$SITE/ returned $code"; exit 1; }
          # Android App Links: the dev app opens invite links on the dev site.
          curl -fsS "$SITE/.well-known/assetlinks.json" \
            | jq -e --arg pkg "$PACKAGE_NAME" 'any(.[]; .target.package_name == $pkg)' > /dev/null \
            || { echo "::error::$SITE/.well-known/assetlinks.json does not list $PACKAGE_NAME"; exit 1; }
          echo "$SITE/ and assetlinks.json OK" | tee -a "$GITHUB_STEP_SUMMARY"

      # Loads the site in headless Chromium: fails on uncaught errors, console
      # errors or failed requests.
      - name: Smoke test the live site
        if: env.APP_ENV == 'dev'
        env:
          SITE: https://${{ vars.FIREBASE_PROJECT }}.web.app
        run: scripts/smoke_web.sh "$SITE/"

      - name: Upload smoke screenshot
        if: always() && env.APP_ENV == 'dev'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-dev
          path: build/tester/web-release.png
          if-no-files-found: ignore
          retention-days: 7
