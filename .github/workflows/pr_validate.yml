name: PR Validation

# The workflow always runs so the required "PR Validation" check is always
# reported. Jobs that don't apply to the changed files are skipped instead,
# and a skipped job counts as passing for branch protection.
on:
  pull_request:
    branches: [main]

# A new push to the same PR supersedes the run in progress.
concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege by default; jobs that need more declare their own block.
permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      dart: ${{ steps.filter.outputs.dart }}
      metadata: ${{ steps.filter.outputs.metadata }}
      workflows: ${{ steps.filter.outputs.workflows }}
      firebase: ${{ steps.filter.outputs.firebase }}
      telemetry: ${{ steps.filter.outputs.telemetry }}
      crm: ${{ steps.filter.outputs.crm }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Only Dart sources and their build inputs affect format/analyze/test.
          filters: |
            dart:
              - "lib/**"
              - "test/**"
              - "pubspec.yaml"
              - "pubspec.lock"
              - "analysis_options.yaml"
              - "build.yaml"
              - "l10n.yaml"
              - ".github/workflows/pr_validate.yml"
              - ".github/actions/flutter-setup/**"
            metadata:
              - "android/fastlane/metadata/**"
              - "android/fastlane/whatsnew/**"
              - "scripts/play_metadata.py"
              - ".github/workflows/pr_validate.yml"
            workflows:
              - ".github/workflows/**"
              - ".github/actions/**"
            firebase:
              - "firebase.json"
              - "firebase/**"
              - ".github/workflows/pr_validate.yml"
            telemetry:
              - "services/telemetry/**"
              - ".github/workflows/pr_validate.yml"
            crm:
              - "crm/**"
              - "services/crm/**"
              - ".github/workflows/pr_validate.yml"

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/flutter-setup
        with:
          codegen: "false"
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: Analyze
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/flutter-setup
      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/flutter-setup
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  store-metadata:
    name: Store metadata
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Offline: text lengths, image sizes and screenshot counts (stdlib only).
      - name: Check store metadata
        run: python3 scripts/play_metadata.py check

  # Firestore security rules are the only thing standing between users and
  # other groups' data, so every rules change is tested on the emulator first.
  firestore-rules:
    name: Firestore rules
    needs: changes
    if: needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: npm ci --prefix firebase/test
      - name: Test rules on the Firestore emulator
        run: >-
          npx --yes firebase-tools@14.27.0 emulators:exec --only firestore
          --project demo-simsplit "npm --prefix firebase/test test"

  # The R-4 telemetry endpoint: type check and unit tests (fakes for Firebase
  # and BigQuery, no network).
  telemetry:
    name: Telemetry endpoint
    needs: changes
    if: needs.changes.outputs.telemetry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: services/telemetry/package-lock.json
      - run: npm ci --prefix services/telemetry
      - run: npm --prefix services/telemetry run typecheck
      - run: npm --prefix services/telemetry test
      # R-8 P5: no known high or critical vulnerability in what the endpoint
      # runs (dev dependencies are build tools, not shipped).
      - run: npm audit --prefix services/telemetry --omit=dev --audit-level=high

  # R-9: the notifications config in crm/ and the service that runs it. The
  # plan (what this PR changes, with a preview of every changed message) is
  # posted as a PR comment and the job summary; no cloud credentials here.
  crm:
    name: CRM config
    needs: changes
    if: needs.changes.outputs.crm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: services/crm/package-lock.json
      - run: npm ci --prefix services/crm
      - run: npm --prefix services/crm run typecheck
      - run: npm --prefix services/crm test
      - run: npm audit --prefix services/crm --omit=dev --audit-level=high
      - name: Validate crm/
        run: npm --prefix services/crm run -s crm -- validate
      - name: Plan against main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          git fetch --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:crm" 2>/dev/null; then
            git archive "$BASE_SHA" crm | tar -x -C "$base"
          fi
          {
            echo "<!-- crm-plan -->"
            npm --prefix services/crm run -s crm -- plan --base "$base/crm"
          } > "$RUNNER_TEMP/plan.md"
          cat "$RUNNER_TEMP/plan.md" >> "$GITHUB_STEP_SUMMARY"
      # A fork's token cannot comment; its plan stays in the job summary.
      - name: Comment the plan
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --edit-last --create-if-none --body-file "$RUNNER_TEMP/plan.md"

  # Workflow files are otherwise only exercised after merge (or on a tag), so
  # lint them here: syntax, expressions, action inputs, and shellcheck on run:.
  workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: mazino2d/github-workflows/.github/workflows/lint.yml@v1

  # Single check to mark as required in branch protection. Passes when every
  # job above succeeded or was skipped; fails if any failed or was cancelled.
  result:
    name: PR Validation
    needs: [changes, format, analyze, test, store-metadata, firestore-rules, telemetry, crm, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A validation job did not pass ($r)"
              exit 1
            fi
          done
