name: Build Android

# Uploads to Google Play only when triggered explicitly:
#   - manually via workflow_dispatch (defaults to the internal track), or
#   - from release.yml when a vX.Y.Z tag is pushed (production track).
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        required: false
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status"
        required: false
        default: "draft"
        type: choice
        options: [completed, draft, inProgress, halted]
  workflow_call:
    inputs:
      track:
        type: string
        default: "internal"
      status:
        type: string
        default: "draft"
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true

# Never run two uploads for the same ref at once (Play rejects concurrent
# edits), but don't cancel one that is already uploading.
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build & Upload AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      # Flutter SDK + pub cache, and build_runner output cached by source hash.
      - uses: ./.github/actions/flutter-setup

      # Secrets are passed through env vars (never interpolated into the script)
      # so special characters cannot break or inject into the shell.
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/simsplit.jks

      - name: Create key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=simsplit.jks\n'
          } > android/key.properties

      - name: Build App Bundle
        # Play requires a unique, increasing versionCode on every upload, so the
        # "+N" build number in pubspec.yaml is overridden in CI. GITHUB_RUN_NUMBER
        # is not usable: under workflow_call it is the *caller's* counter
        # (release.yml), so manual and tag runs would collide. Instead use minutes
        # elapsed since 2026-01-01 UTC: monotonic across all workflows and
        # re-runs, far above the old pubspec codes (<= 5) and far below Play's
        # 2,100,000,000 limit.
        run: |
          BUILD_NUMBER=$(( ($(date -u +%s) - 1767225600) / 60 ))
          echo "versionCode: $BUILD_NUMBER"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: simsplit-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      # Keyless auth via Workload Identity Federation, managed in
      # mazino2d/everything-as-code (terraform/gcp/mazino2d-as-se1-dev/github_actions.tf).
      # Only main and vX.Y.Z tags of this repo can impersonate the account.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/238020767329/locations/global/workloadIdentityPools/github/providers/sim-split
          service_account: gha-play-publisher@mazino2d-as-se1-dev.iam.gserviceaccount.com

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          packageName: com.mazino2d.simsplit
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || github.event.inputs.track || 'internal' }}
          status: ${{ inputs.status || github.event.inputs.status || 'draft' }}

      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/simsplit.jks android/key.properties
