name: Build Android

# Uploads to Google Play, one Play app per environment:
#   - dev (`--flavor dev`, APP_ENV=dev, com.mazino2d.simsplit.dev "SimSplit Dev",
#     Firebase simsplit-as-se1-dev):
#       - on push to main when app code changes (internal track, completed, so
#         internal testers get it at once), or
#       - manually via workflow_dispatch (defaults to the internal track);
#   - prd (`--flavor prd`, APP_ENV=prd, com.mazino2d.simsplit, Firebase
#     simsplit-as-se1-prd), only from a tag:
#       - release.yml (vYYYY.M.D tag → production, completed: 100 %) or
#       - release_candidate.yml (vYYYY.M.D-rc.N tag → alpha, completed).
# The job runs in the GitHub Environment of the same name (managed in
# mazino2d/everything-as-code): dev admits main only, so manual runs work from
# main; prd admits v* tags and waits for the maintainer's approval.
on:
  push:
    branches: [main]
    # pubspec.yaml is left out on purpose: a release PR only bumps its version,
    # which needs no new dev build. Dependency changes still show up in
    # pubspec.lock.
    paths:
      - "lib/**"
      - "android/**"
      # Store listing, Data safety and release notes ship through
      # play_metadata.yml and release.yml, not as a new build.
      - "!android/fastlane/**"
      - "assets/**"
      - "l10n.yaml"
      - "pubspec.lock"
      - ".github/actions/flutter-setup/**"
      - ".github/workflows/build_android.yml"
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        required: false
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status"
        required: false
        default: "draft"
        type: choice
        options: [completed, draft, inProgress, halted]
      user_fraction:
        description: "Staged rollout share, 0-1 (status inProgress only)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      track:
        type: string
        default: "internal"
      status:
        type: string
        default: "draft"
      user_fraction:
        type: string
        default: ""
      # The tag that triggered the caller (vYYYY.M.D or vYYYY.M.D-rc.N). Set,
      # it builds prd under the tag's name; empty builds dev with a dev name.
      # See "Build App Bundle".
      release_tag:
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true

jobs:
  build-android:
    name: Build & Upload AAB
    # Play rejects concurrent edits on one app, so every workflow that edits a
    # Play app (this one, play_metadata.yml, play_rollout.yml) shares one group
    # per package: play-<package name>. It sits on the job, not the workflow:
    # under workflow_call a workflow-level group is evaluated in the caller's
    # context. Callers (release.yml, release_candidate.yml) must not hold a
    # play-* group themselves, or the called job would wait on its own caller.
    # Never cancel a run that may be uploading.
    concurrency:
      group: play-${{ inputs.release_tag != '' && 'com.mazino2d.simsplit' || 'com.mazino2d.simsplit.dev' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    # Only a release tag builds prd; main and manual runs build dev. The
    # environment can't read the job's env, so it repeats the test.
    environment: ${{ inputs.release_tag != '' && 'prd' || 'dev' }}
    env:
      APP_ENV: ${{ inputs.release_tag != '' && 'prd' || 'dev' }}
      PACKAGE_NAME: ${{ inputs.release_tag != '' && 'com.mazino2d.simsplit' || 'com.mazino2d.simsplit.dev' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      # Flutter SDK + pub cache, and build_runner output cached by source hash.
      - uses: ./.github/actions/flutter-setup

      # Secrets are passed through env vars (never interpolated into the script)
      # so special characters cannot break or inject into the shell.
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/simsplit.jks

      - name: Create key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=simsplit.jks\n'
          } > android/key.properties

      - name: Build App Bundle
        # Play requires a unique, increasing versionCode on every upload, so the
        # "+N" build number in pubspec.yaml is overridden in CI. GITHUB_RUN_NUMBER
        # is not usable: under workflow_call it is the *caller's* counter
        # (release.yml), so manual and tag runs would collide. Instead use
        # seconds elapsed since 2026-01-01 UTC: monotonic across all workflows
        # and re-runs, and builds of one app also run one after the other (the
        # play-<package> group above), so two never share a code.
        # Until 2026-10 the code counted *minutes* since the same date, so two
        # builds in one minute collided; those codes stay below 525,600 until
        # 2027, while seconds were already ~25,800,000 when the switch shipped,
        # so every new code is above every code uploaded before.
        # Headroom: Play's limit of 2,100,000,000 seconds lasts ~66 years
        # (until ~2092).
        #
        # The versionName tells the builds apart (Play only compares codes):
        #   production  vYYYY.M.D tag       → YYYY.M.D
        #   closed test vYYYY.M.D-rc.N tag  → YYYY.M.D-rc.N
        #   anything else (main, manual)    → YYYY.M.D-dev.<sha7>, build date UTC
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          # R-4 telemetry endpoint, a prd environment variable set by
          # everything-as-code; while it is unset, error reports are queued but
          # never sent. The endpoint accepts App Check tokens from the prd
          # project only, so dev builds never send telemetry.
          TELEMETRY_URL: ${{ inputs.release_tag != '' && vars.TELEMETRY_URL || '' }}
        run: |
          BUILD_NUMBER=$(( $(date -u +%s) - 1767225600 ))
          if [ -n "$RELEASE_TAG" ]; then
            BUILD_NAME="${RELEASE_TAG#v}"
          else
            BUILD_NAME="$(date -u +%Y.%-m.%-d)-dev.${GITHUB_SHA::7}"
          fi
          echo "$PACKAGE_NAME ($APP_ENV) versionName: $BUILD_NAME, versionCode: $BUILD_NUMBER" | tee -a "$GITHUB_STEP_SUMMARY"
          flutter build appbundle --release --flavor "$APP_ENV" \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=TELEMETRY_URL="$TELEMETRY_URL"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          # release.yml and release_candidate.yml download it by this name.
          name: simsplit-${{ env.APP_ENV }}-release.aab
          path: build/app/outputs/bundle/${{ env.APP_ENV }}Release/app-${{ env.APP_ENV }}-release.aab
          retention-days: 7

      # Keyless auth via Workload Identity Federation, managed in
      # mazino2d/everything-as-code (terraform/gcp/simsplit-as-se1-prd/github_actions.tf).
      # Only main and v* tags (vYYYY.M.D, vYYYY.M.D-rc.N) of this repo can impersonate the account.
      # The same account uploads both Play apps; it needs access to SimSplit
      # Dev in Play Console → Users and permissions too.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/113980760756/locations/global/workloadIdentityPools/github/providers/sim-split
          service_account: gha-play-publisher@simsplit-as-se1-prd.iam.gserviceaccount.com

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/${{ env.APP_ENV }}Release/app-${{ env.APP_ENV }}-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || (github.event_name == 'push' && 'completed') || 'draft' }}
          userFraction: ${{ inputs.user_fraction }}
          # Release notes go with tagged releases (production and closed test).
          whatsNewDirectory: ${{ inputs.release_tag != '' && 'android/fastlane/whatsnew' || '' }}

      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/simsplit.jks android/key.properties
