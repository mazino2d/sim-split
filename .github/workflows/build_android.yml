name: Build Android

# Uploads to Google Play only when triggered explicitly:
#   - manually via workflow_dispatch (defaults to the internal track), or
#   - from release.yml when a vX.Y.Z tag is pushed (production track).
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        required: false
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status"
        required: false
        default: "draft"
        type: choice
        options: [completed, draft, inProgress, halted]
  workflow_call:
    inputs:
      track:
        type: string
        default: "internal"
      status:
        type: string
        default: "draft"
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: true

jobs:
  build-android:
    name: Build & Upload AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      # Secrets are passed through env vars (never interpolated into the script)
      # so special characters cannot break or inject into the shell.
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/simsplit.jks

      - name: Create key.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=simsplit.jks\n'
          } > android/key.properties

      - name: Build App Bundle
        # Play requires a unique, increasing versionCode on every upload, so the
        # "+N" build number in pubspec.yaml is overridden in CI. GITHUB_RUN_NUMBER
        # is not usable: under workflow_call it is the *caller's* counter
        # (release.yml), so manual and tag runs would collide. Instead use minutes
        # elapsed since 2026-01-01 UTC: monotonic across all workflows and
        # re-runs, far above the old pubspec codes (<= 5) and far below Play's
        # 2,100,000,000 limit.
        run: |
          BUILD_NUMBER=$(( ($(date -u +%s) - 1767225600) / 60 ))
          echo "versionCode: $BUILD_NUMBER"
          flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: simsplit-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mazino2d.simsplit
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || github.event.inputs.track || 'internal' }}
          status: ${{ inputs.status || github.event.inputs.status || 'draft' }}

      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/simsplit.jks android/key.properties
